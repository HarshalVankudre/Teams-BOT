version: "1.0.0"
table: equipment_matrix

# Cast recipes for NUMERIC_TEXT columns (values stored as text like "3410 mm")
cast_recipes:
  mm: "CAST(NULLIF(regexp_replace({col}, '[^0-9]', '', 'g'), '') AS NUMERIC)"
  m: "CAST(NULLIF(REPLACE(regexp_replace({col}, '[^0-9,.]', '', 'g'), ',', '.'), '') AS NUMERIC)"
  kg: "CAST(NULLIF(regexp_replace({col}, '[^0-9]', '', 'g'), '') AS NUMERIC)"
  kW: "CAST(NULLIF(regexp_replace({col}, '[^0-9]', '', 'g'), '') AS NUMERIC)"
  t: "CAST(NULLIF(REPLACE(regexp_replace({col}, '[^0-9,.]', '', 'g'), ',', '.'), '') AS NUMERIC)"
  m3: "CAST(NULLIF(REPLACE(regexp_replace({col}, '[^0-9,.]', '', 'g'), ',', '.'), '') AS NUMERIC)"
  bar: "CAST(NULLIF(regexp_replace({col}, '[^0-9]', '', 'g'), '') AS NUMERIC)"

# Core columns (always include in reduced schema)
core_columns:
  - column: id
    business_name: ID
    description: Unique identifier for each equipment record
    data_type: BIGINT
    null_ratio: 0.0

  - column: bezeichnung
    business_name: Bezeichnung / Model
    description: Equipment model name and designation
    synonyms: [name, modell, model, maschine, bezeichnung, typ]
    data_type: TEXT
    null_ratio: 0.0

  - column: seriennummer
    business_name: Seriennummer
    description: Serial number of the equipment
    synonyms: [serial, seriennummer, sn, serial number]
    data_type: TEXT
    null_ratio: 0.0

  - column: inventarnummer
    business_name: Inventarnummer
    description: Internal inventory number
    synonyms: [inventar, inventory, inv]
    data_type: TEXT
    null_ratio: 0.0

  - column: hersteller_name
    business_name: Hersteller
    description: |
      Manufacturer name. Common values: Caterpillar, Liebherr, BOMAG, Wirtgen, Hamm, Wacker Neuson, etc.
      WICHTIG: Werte sind case-sensitive (z.B. "BOMAG" nicht "Bomag")
    synonyms: [hersteller, manufacturer, marke, brand, firma]
    data_type: CATEGORICAL
    null_ratio: 0.0

  - column: geraetegruppe_name
    business_name: Gerätegruppe / Equipment Type
    description: |
      Equipment category. KRITISCH für Kette/Mobil/Rad-Unterscheidung!
      Enthält Werte wie: Kettenbagger, Mobilbagger, Kettenfertiger, Radfertiger, Minibagger, etc.
      IMMER diese Spalte für Kette vs. Mobil Fragen verwenden!
      Für Straßenbau: Kettenfertiger, Radfertiger, Walzen.
    synonyms: [kategorie, category, typ, type, gerätegruppe, maschinentyp, kette, mobil, rad, kettenbagger, mobilbagger, radfertiger, kettenfertiger, fertiger, strasse, strassenbau, asphalt, walze, road]
    data_type: CATEGORICAL
    null_ratio: 0.0

  - column: verwendung_code
    business_name: Verwendung
    description: |
      Usage type: MIET (rental/Vermietung) or VK (sale/Verkauf)
    synonyms: [verwendung, miete, verkauf, rental, sale]
    data_type: CATEGORICAL
    null_ratio: 0.0

  - column: nuclos_state
    business_name: Verfügbarkeit
    description: |
      Availability status: Released (available) or Locked (not available)
    synonyms: [status, verfügbar, available, released, locked]
    data_type: CATEGORICAL
    null_ratio: 0.0

# Property columns (enriched top 30, then auto-generated rest)
columns:
