    synonyms: [breite, width, transportbreite, durchfahrtsbreite, breit]
    data_type: NUMERIC_TEXT
    unit: mm
    null_ratio: 0.7151
    examples: ["2500 mm", "3000 mm", "2990 mm"]

  - column: prop_e1730_gewicht_kg
    code: E1730
